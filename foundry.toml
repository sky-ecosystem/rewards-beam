[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.21"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
